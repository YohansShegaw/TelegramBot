server:
  port: ${PORT:8080}
spring:
  application:
    name: branch-telegram-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TG_DB_USERNAME:jdbc:postgresql://localhost:5432/enterprise_sales_bot}
    username: ${TG_DB_USERNAME:postgres}
    password: ${TG_DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
  polling:
    enabled: true
    timeout-seconds: 30
  delete:
    customer-enabled: false